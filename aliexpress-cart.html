<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>My Cart - AliExpress</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f5;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #eee;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
      stroke: #333;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-btn svg {
      width: 22px;
      height: 22px;
      stroke: #333;
    }

    /* Empty Cart Section */
    .empty-cart {
      background: #fff;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 10px;
    }

    .empty-cart-illustration {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      position: relative;
    }

    .empty-cart-illustration svg {
      width: 100%;
      height: 100%;
    }

    .empty-cart-text {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .cart-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-shopping {
      padding: 10px 20px;
      border: 2px solid #f57224;
      background: #fff;
      color: #f57224;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-shopping:hover {
      background: #fff5f0;
    }

    .btn-shopping:active {
      transform: scale(0.98);
    }

    .btn-signin {
      padding: 10px 20px;
      border: none;
      background: linear-gradient(to right, #f57224, #f57224);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-signin:hover {
      background: linear-gradient(to right, #e56520, #e56520);
    }

    .btn-signin:active {
      transform: scale(0.98);
    }

    /* Just For You Section */
    .just-for-you {
      background: #fff;
      padding: 16px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .heart-icon {
      width: 16px;
      height: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .product-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #eee;
      cursor: pointer;
      transition: all 0.2s;
    }

    .product-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .product-card:active {
      transform: scale(0.98);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #f8f8f8;
      position: relative;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #fff;
      border: 1px solid #e91e8c;
      color: #e91e8c;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 2px;
    }

    .product-info {
      padding: 10px;
    }

    .product-name {
      font-size: 13px;
      color: #333;
      line-height: 1.4;
      height: 36px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 8px;
    }

    .product-price {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .price {
      font-size: 16px;
      font-weight: 700;
      color: #f57224;
    }

    .discount {
      font-size: 12px;
      color: #f57224;
    }

    .product-rating {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .star-icon {
      width: 14px;
      height: 14px;
      fill: #ffc107;
    }

    .rating-value {
      font-size: 12px;
      color: #333;
      font-weight: 500;
    }

    .rating-count {
      font-size: 12px;
      color: #999;
    }

    /* Scrollable area */
    .main-content {
      height: calc(100vh - 56px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .main-content::-webkit-scrollbar {
      display: none;
    }

    /* Loading animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .product-card {
      animation: fadeIn 0.3s ease forwards;
    }

    .product-card:nth-child(1) { animation-delay: 0.05s; }
    .product-card:nth-child(2) { animation-delay: 0.1s; }
    .product-card:nth-child(3) { animation-delay: 0.15s; }
    .product-card:nth-child(4) { animation-delay: 0.2s; }
    .product-card:nth-child(5) { animation-delay: 0.25s; }
    .product-card:nth-child(6) { animation-delay: 0.3s; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="header-title">My Cart</h1>
    </div>
    <button class="delete-btn" id="deleteBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    </button>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Empty Cart Section -->
    <section class="empty-cart">
      <div class="empty-cart-illustration">
        <svg viewBox="0 0 120 120" fill="none">
          <!-- Document/List -->
          <rect x="30" y="20" width="60" height="75" rx="4" fill="#FFEEE3" stroke="#F57224" stroke-width="2"/>
          <!-- Lines on document -->
          <line x1="40" y1="35" x2="80" y2="35" stroke="#F57224" stroke-width="2" stroke-linecap="round"/>
          <line x1="40" y1="48" x2="75" y2="48" stroke="#F57224" stroke-width="2" stroke-linecap="round"/>
          <line x1="40" y1="61" x2="70" y2="61" stroke="#F57224" stroke-width="2" stroke-linecap="round"/>
          <line x1="40" y1="74" x2="65" y2="74" stroke="#F57224" stroke-width="2" stroke-linecap="round"/>
          <!-- Magnifying glass -->
          <circle cx="75" cy="75" r="18" fill="#fff" stroke="#666" stroke-width="2"/>
          <line x1="88" y1="88" x2="100" y2="100" stroke="#666" stroke-width="3" stroke-linecap="round"/>
          <!-- X mark in magnifying glass -->
          <line x1="69" y1="69" x2="81" y2="81" stroke="#999" stroke-width="2" stroke-linecap="round"/>
          <line x1="81" y1="69" x2="69" y2="81" stroke="#999" stroke-width="2" stroke-linecap="round"/>
          <!-- Decorative elements -->
          <circle cx="25" cy="30" r="3" fill="#4ECDC4"/>
          <circle cx="95" cy="25" r="2" fill="#F57224"/>
          <line x1="20" y1="50" x2="25" y2="45" stroke="#4ECDC4" stroke-width="2" stroke-linecap="round"/>
          <line x1="20" y1="45" x2="25" y2="50" stroke="#4ECDC4" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="empty-cart-text">You haven't added anything here</p>
      <div class="cart-buttons">
        <button class="btn-shopping" id="goShoppingBtn">Go Shopping</button>
        <button class="btn-signin" id="signInBtn">Sign in/ Sign up</button>
      </div>
    </section>

    <!-- Just For You Section -->
    <section class="just-for-you">
      <div class="section-header">
        <svg class="heart-icon" viewBox="0 0 24 24" fill="#f57224">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <h2 class="section-title">Just For You</h2>
        <svg class="heart-icon" viewBox="0 0 24 24" fill="#f57224">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </div>

      <!-- Products Grid -->
      <div class="products-grid" id="productsGrid">
        <!-- Products will be loaded by JavaScript -->
      </div>
    </section>
  </main>

  <script>
    // Product data
    const products = [
      {
        id: 1,
        name: "P9 Wireless Headset Bluetooth Gaming...",
        price: "Rs.998",
        discount: "-71%",
        rating: 4.8,
        reviews: 421,
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300&h=300&fit=crop",
        badge: null
      },
      {
        id: 2,
        name: "Adidas Tshirts Sports High Quality Imported...",
        price: "Rs.998",
        discount: "-50%",
        rating: 4.9,
        reviews: 23,
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=300&h=300&fit=crop",
        badge: "Code: 078"
      },
      {
        id: 3,
        name: "Gaming Finger Sleeves for Mobile...",
        price: "Rs.299",
        discount: "-45%",
        rating: 4.5,
        reviews: 156,
        image: "https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?w=300&h=300&fit=crop",
        badge: null
      },
      {
        id: 4,
        name: "Mini Indoor Plant Pot Decorative...",
        price: "Rs.450",
        discount: "-30%",
        rating: 4.7,
        reviews: 89,
        image: "https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=300&h=300&fit=crop",
        badge: null
      },
      {
        id: 5,
        name: "Wireless Earbuds Pro TWS Bluetooth...",
        price: "Rs.1,299",
        discount: "-60%",
        rating: 4.6,
        reviews: 312,
        image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=300&h=300&fit=crop",
        badge: "Hot"
      },
      {
        id: 6,
        name: "Smart Watch Fitness Tracker Band...",
        price: "Rs.799",
        discount: "-55%",
        rating: 4.4,
        reviews: 178,
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300&h=300&fit=crop",
        badge: null
      }
    ];

    // Render products
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = products.map(product => `
        <div class="product-card" onclick="handleProductClick(${product.id})">
          <div class="product-image">
            <img src="${product.image}" alt="${product.name}" loading="lazy">
            ${product.badge ? `<span class="product-badge">${product.badge}</span>` : ''}
          </div>
          <div class="product-info">
            <p class="product-name">${product.name}</p>
            <div class="product-price">
              <span class="price">${product.price}</span>
              <span class="discount">${product.discount}</span>
            </div>
            <div class="product-rating">
              <svg class="star-icon" viewBox="0 0 24 24">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
              <span class="rating-value">${product.rating}</span>
              <span class="rating-count">(${product.reviews})</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Handle product click
    function handleProductClick(productId) {
      const product = products.find(p => p.id === productId);
      alert(`Opening: ${product.name}`);
    }

    // Back button
    document.getElementById('backBtn').addEventListener('click', function() {
      alert('Going back to previous page');
    });

    // Delete button
    document.getElementById('deleteBtn').addEventListener('click', function() {
      alert('Cart is empty - nothing to delete');
    });

    // Go Shopping button
    document.getElementById('goShoppingBtn').addEventListener('click', function() {
      alert('Redirecting to shopping page...');
    });

    // Sign In button
    document.getElementById('signInBtn').addEventListener('click', function() {
      alert('Opening Sign in / Sign up page...');
    });

    // Infinite scroll - load more products
    const mainContent = document.querySelector('.main-content');
    let isLoading = false;

    mainContent.addEventListener('scroll', function() {
      const scrollTop = mainContent.scrollTop;
      const scrollHeight = mainContent.scrollHeight;
      const clientHeight = mainContent.clientHeight;

      if (scrollTop + clientHeight >= scrollHeight - 100 && !isLoading) {
        isLoading = true;
        loadMoreProducts();
      }
    });

    function loadMoreProducts() {
      setTimeout(() => {
        const newProducts = [
          {
            id: products.length + 1,
            name: "USB Type-C Fast Charging Cable...",
            price: "Rs.199",
            discount: "-40%",
            rating: 4.3,
            reviews: 245,
            image: "https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=300&h=300&fit=crop",
            badge: null
          },
          {
            id: products.length + 2,
            name: "Phone Stand Holder Desktop Mount...",
            price: "Rs.349",
            discount: "-35%",
            rating: 4.6,
            reviews: 127,
            image: "https://images.unsplash.com/photo-1586816879360-004f5b0c51e3?w=300&h=300&fit=crop",
            badge: "New"
          }
        ];

        products.push(...newProducts);
        renderProducts();
        isLoading = false;
      }, 500);
    }

    // Initialize
    renderProducts();
  </script>
</body>
</html>
